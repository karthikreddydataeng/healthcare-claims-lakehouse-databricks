name: Python Validation Check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate-healthcare-claims:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run healthcare claims validation script
        run: python scripts/validate_claims.py
